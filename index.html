<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image" content="images/chibi-portraits-in-hand-1.png">
  <meta name="description" content="Jasmine Kinanti Putri Pages">
  <meta name="author" content="Ahmad Faris Asy'arie dan Jasmine Kinanti Putri">
  <link rel="shortcut icon" href="icon/favicon.ico" type="image/x-icon">
  <link rel="icon" href="images/icon/favicon.ico" type="image/x-icon">
  <title>Jasmine Kinanti Putri</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #6F8FAF;
      font-family: "Poppins", sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    .container img {
      width: 250px;
      max-width: 80%;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    .container img:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 1.8rem;
      color: #444;
      margin-bottom: 10px;
    }

    .btn {
      background-color: #4682B4;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #7393B3;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.4rem;
      }

      .btn {
        padding: 12px 24px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Faris &amp; Jasmine<br/>Mengudang Kamu!</h1>
    <img src="images/chibi-portraits-in-hand.png" alt="Foto Undangan">
    <a href="undangan.html" class="btn">Buka Undangan</a>
  </div>
</body>
</html>
